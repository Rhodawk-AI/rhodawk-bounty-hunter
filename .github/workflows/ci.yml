# CI: fast launch-hygiene gate — shell syntax + the full test suite + a
# wheel-cleanliness build check on every push / PR to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: shell syntax + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: bash -n (all tracked shell scripts)
        run: git ls-files '*.sh' | xargs -r bash -n

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: pytest
        run: pytest -q

  # Release audit R-01: a wheel built from a used source tree must never
  # contain runtime artifacts (recon/, findings/, ...). tests/
  # test_wheel_cleanliness.py already asserts this in-suite; the explicit
  # step keeps the gate visible in CI and pins the build dependency.
  wheel-gate:
    name: wheel cleanliness (no runtime artifacts in wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: bash -n (all tracked shell scripts)
        run: git ls-files '*.sh' | xargs -r bash -n

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: wheel cleanliness (no runtime artifacts in wheel)
        run: |
          python -m build --wheel --outdir dist/
          python tests/check_wheel_clean.py dist/*.whl
