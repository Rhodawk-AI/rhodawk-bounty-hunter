# CI: fast launch-hygiene gate — shell syntax + the full test suite + a
# wheel-cleanliness build check on every push / PR to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: shell syntax + pytest + wheel gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: bash -n (shell syntax)
        run: bash -n rhodawk/tools/recon_engine.sh install.sh install_tools.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: pytest
        run: pytest -q

      # Release audit R-01: a wheel built from a used source tree must never
      # contain runtime artifacts (recon/, findings/, ...). tests/
      # test_wheel_cleanliness.py already asserts this in-suite; the explicit
      # step keeps the gate visible in CI and pins the build dependency.
      - name: wheel cleanliness (no runtime artifacts in wheel)
        run: |
          python -m build --wheel --outdir dist/
          python tests/check_wheel_clean.py dist/*.whl
